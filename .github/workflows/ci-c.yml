name: "CI Quality (C/C++/Python/Java) - run ONLY selected OS"

on:
  pull_request:
  push:
  workflow_dispatch:
    inputs:
      target_os:
        description: "OS cible à exécuter"
        required: false
        default: "linux"
        type: choice
        options:
          - linux
          - windows
          - macos

permissions:
  contents: read

# ==========================================================
# MODIFIER ICI les dossiers sources pour chaque langage
# Exemple:
#   C_DIR: src/c
#   CPP_DIR: src/cpp
#   PY_DIR: src/python
#   JAVA_DIR: src
# ==========================================================
env:
  C_DIR: .
  CPP_DIR: .
  PY_DIR: .
  JAVA_DIR: .

jobs:
  detect-target:
    name: Detect target OS
    runs-on: ubuntu-24.04
    outputs:
      target: ${{ steps.pick.outputs.target }}
      matrix: ${{ steps.pick.outputs.matrix }}
    env:
      INPUT_TARGET: ${{ github.event.inputs.target_os || '' }}
      REF_NAME: ${{ github.head_ref || github.ref_name }}
      PR_TITLE: ${{ github.event.pull_request.title || '' }}
      PR_BODY: ${{ github.event.pull_request.body || '' }}
      COMMIT_MSG: ${{ github.event.head_commit.message || '' }}
    steps:
      - name: Pick target OS
        id: pick
        shell: bash
        run: |
          set -euo pipefail

          manual="$(printf '%s' "$INPUT_TARGET" | tr '[:upper:]' '[:lower:]')"
          ref="$(printf '%s' "$REF_NAME" | tr '[:upper:]' '[:lower:]')"
          text="$(printf '%s %s %s' "$PR_TITLE" "$PR_BODY" "$COMMIT_MSG" | tr '[:upper:]' '[:lower:]')"

          if [[ "$manual" == "windows" ]]; then
            target="windows"
            matrix='{"include":[{"os":"windows-2022","label":"Windows"}]}'
          elif [[ "$manual" == "macos" ]]; then
            target="macos"
            matrix='{"include":[{"os":"macos-14","label":"macOS"}]}'
          elif [[ "$manual" == "linux" ]]; then
            target="linux"
            matrix='{"include":[{"os":"ubuntu-24.04","label":"Ubuntu"}]}'
          elif [[ "$ref" == windows/* ]] || [[ "$text" == *"[windows]"* ]]; then
            target="windows"
            matrix='{"include":[{"os":"windows-2022","label":"Windows"}]}'
          elif [[ "$ref" == macos/* ]] || [[ "$ref" == mac/* ]] || [[ "$text" == *"[macos]"* ]] || [[ "$text" == *"[mac]"* ]]; then
            target="macos"
            matrix='{"include":[{"os":"macos-14","label":"macOS"}]}'
          else
            target="linux"
            matrix='{"include":[{"os":"ubuntu-24.04","label":"Ubuntu"}]}'
          fi

          echo "target=$target" >> "$GITHUB_OUTPUT"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

      - name: Show target
        run: |
          echo "Target = ${{ steps.pick.outputs.target }}"
          echo "Matrix = ${{ steps.pick.outputs.matrix }}"

  quality-c:
    name: "C Quality on ${{ matrix.label }}"
    needs: [detect-target]
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.detect-target.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12

    steps:
      - uses: actions/checkout@v4

      - name: Detect C files (Unix)
        if: runner.os != 'Windows'
        id: ccheck_unix
        shell: bash
        run: |
          set -euo pipefail
          if [ -d "$C_DIR" ] && find "$C_DIR" -type f \( -name "*.c" -o -name "*.h" \) | grep -q .; then
            echo "has_c=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_c=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Detect C files (Windows)
        if: runner.os == 'Windows'
        id: ccheck_windows
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          if (Test-Path $env:C_DIR) {
            $files = Get-ChildItem $env:C_DIR -Recurse -File -Include *.c,*.h -ErrorAction SilentlyContinue
          } else {
            $files = @()
          }
          if ($files.Count -gt 0) {
            "has_c=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          } else {
            "has_c=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          }

      - name: Install C tools (Linux)
        if: steps.ccheck_unix.outputs.has_c == 'true' && runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang clang-format cppcheck

      - name: Install C tools (macOS)
        if: steps.ccheck_unix.outputs.has_c == 'true' && runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          brew update
          brew install llvm cppcheck
          echo "$(brew --prefix llvm)/bin" >> "$GITHUB_PATH"

      - name: Install C tools (Windows)
        if: steps.ccheck_windows.outputs.has_c == 'true' && runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          choco upgrade -y llvm cppcheck

          Import-Module "$env:ChocolateyInstall\helpers\chocolateyProfile.psm1" -Force
          refreshenv

          $llvmBin = "C:\Program Files\LLVM\bin"
          if (-not (Test-Path $llvmBin)) {
            throw "LLVM bin not found: $llvmBin"
          }
          $llvmBin | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

          $cppCandidates = @(
            "C:\Program Files\Cppcheck\cppcheck.exe",
            "C:\Program Files (x86)\Cppcheck\cppcheck.exe"
          )

          $cppExe = $cppCandidates | Where-Object { Test-Path $_ } | Select-Object -First 1

          if (-not $cppExe) {
            try {
              $cmd = Get-Command cppcheck -ErrorAction Stop
              $cppExe = $cmd.Source
            } catch {
              throw "cppcheck.exe not found after Chocolatey install/upgrade"
            }
          }

          $cppDir = Split-Path $cppExe -Parent
          $cppDir | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

          Write-Host "cppcheck.exe = $cppExe"
          clang-format --version
          & $cppExe --version

      - name: clang-format check [C] (Unix)
        if: steps.ccheck_unix.outputs.has_c == 'true' && runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          find "$C_DIR" -type f \( -name "*.c" -o -name "*.h" \) -print0 \
            | xargs -0 -I{} clang-format -style=LLVM -i "{}"
          git diff --exit-code

      - name: clang-format check [C] (Windows)
        if: steps.ccheck_windows.outputs.has_c == 'true' && runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Get-ChildItem $env:C_DIR -Recurse -File -Include *.c,*.h -ErrorAction SilentlyContinue |
            ForEach-Object { & clang-format -style=LLVM -i $_.FullName }
          git diff --exit-code

      - name: Static analysis (cppcheck) [C] (Unix)
        if: steps.ccheck_unix.outputs.has_c == 'true' && runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          cppcheck --enable=all --inconclusive \
            --inline-suppr --error-exitcode=1 \
            --suppress=missingIncludeSystem \
            "$C_DIR"

      - name: Static analysis (cppcheck) [C] (Windows)
        if: steps.ccheck_windows.outputs.has_c == 'true' && runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $cppCandidates = @(
            "C:\Program Files\Cppcheck\cppcheck.exe",
            "C:\Program Files (x86)\Cppcheck\cppcheck.exe"
          )

          $cppExe = $cppCandidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $cppExe) {
            $cppExe = (Get-Command cppcheck -ErrorAction Stop).Source
          }

          & $cppExe --enable=all --inconclusive --inline-suppr --error-exitcode=1 --suppress=missingIncludeSystem $env:C_DIR

      - name: Compile all C units (Unix)
        if: steps.ccheck_unix.outputs.has_c == 'true' && runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build_c/obj
          while IFS= read -r f; do
            out="build_c/obj/$(echo "$f" | sed 's|^\./||; s|[/:\\]|_|g').o"
            clang -std=c11 -Wall -Wextra -Werror -O2 -c "$f" -o "$out"
          done < <(find "$C_DIR" -type f -name "*.c")

      - name: Compile all C units (Windows)
        if: steps.ccheck_windows.outputs.has_c == 'true' && runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force -Path build_c/obj | Out-Null
          $files = Get-ChildItem $env:C_DIR -Recurse -File -Include *.c -ErrorAction SilentlyContinue
          foreach ($f in $files) {
            $safe = ($f.FullName -replace '^[A-Za-z]:\\', '' -replace '[\\/]', '_')
            & clang -std=c11 -Wall -Wextra -Werror -O2 -c $f.FullName -o "build_c/obj/$safe.obj"
          }

      - name: C skipped
        if: steps.ccheck_unix.outputs.has_c != 'true' && steps.ccheck_windows.outputs.has_c != 'true'
        run: echo "No C files -> skipping"

  quality-cpp:
    name: "C++ Quality on ${{ matrix.label }}"
    needs: [detect-target]
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.detect-target.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12

    steps:
      - uses: actions/checkout@v4

      - name: Detect C++ files (Unix)
        if: runner.os != 'Windows'
        id: cppcheck_unix
        shell: bash
        run: |
          set -euo pipefail
          if [ -d "$CPP_DIR" ] && find "$CPP_DIR" -type f \( -name "*.cpp" -o -name "*.cc" -o -name "*.cxx" -o -name "*.hpp" -o -name "*.hxx" -o -name "*.h" \) | grep -q .; then
            echo "has_cpp=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_cpp=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Detect C++ files (Windows)
        if: runner.os == 'Windows'
        id: cppcheck_windows
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          if (Test-Path $env:CPP_DIR) {
            $files = Get-ChildItem $env:CPP_DIR -Recurse -File -Include *.cpp,*.cc,*.cxx,*.hpp,*.hxx,*.h -ErrorAction SilentlyContinue
          } else {
            $files = @()
          }
          if ($files.Count -gt 0) {
            "has_cpp=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          } else {
            "has_cpp=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          }

      - name: Install C++ tools (Linux)
        if: steps.cppcheck_unix.outputs.has_cpp == 'true' && runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang clang-format cppcheck

      - name: Install C++ tools (macOS)
        if: steps.cppcheck_unix.outputs.has_cpp == 'true' && runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          brew update
          brew install llvm cppcheck
          echo "$(brew --prefix llvm)/bin" >> "$GITHUB_PATH"

      - name: Install C++ tools (Windows)
        if: steps.cppcheck_windows.outputs.has_cpp == 'true' && runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          choco upgrade -y llvm cppcheck

          Import-Module "$env:ChocolateyInstall\helpers\chocolateyProfile.psm1" -Force
          refreshenv

          $llvmBin = "C:\Program Files\LLVM\bin"
          if (-not (Test-Path $llvmBin)) {
            throw "LLVM bin not found: $llvmBin"
          }
          $llvmBin | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

          $cppCandidates = @(
            "C:\Program Files\Cppcheck\cppcheck.exe",
            "C:\Program Files (x86)\Cppcheck\cppcheck.exe"
          )

          $cppExe = $cppCandidates | Where-Object { Test-Path $_ } | Select-Object -First 1

          if (-not $cppExe) {
            try {
              $cmd = Get-Command cppcheck -ErrorAction Stop
              $cppExe = $cmd.Source
            } catch {
              throw "cppcheck.exe not found after Chocolatey install/upgrade"
            }
          }

          $cppDir = Split-Path $cppExe -Parent
          $cppDir | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

          Write-Host "cppcheck.exe = $cppExe"
          clang-format --version
          & $cppExe --version

      - name: clang-format check [C++] (Unix)
        if: steps.cppcheck_unix.outputs.has_cpp == 'true' && runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          find "$CPP_DIR" -type f \( -name "*.cpp" -o -name "*.cc" -o -name "*.cxx" -o -name "*.hpp" -o -name "*.hxx" -o -name "*.h" \) -print0 \
            | xargs -0 -I{} clang-format -style=LLVM -i "{}"
          git diff --exit-code

      - name: clang-format check [C++] (Windows)
        if: steps.cppcheck_windows.outputs.has_cpp == 'true' && runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Get-ChildItem $env:CPP_DIR -Recurse -File -Include *.cpp,*.cc,*.cxx,*.hpp,*.hxx,*.h -ErrorAction SilentlyContinue |
            ForEach-Object { & clang-format -style=LLVM -i $_.FullName }
          git diff --exit-code

      - name: Static analysis (cppcheck) [C++] (Unix)
        if: steps.cppcheck_unix.outputs.has_cpp == 'true' && runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          cppcheck --enable=all --inconclusive \
            --inline-suppr --error-exitcode=1 \
            --suppress=missingIncludeSystem \
            "$CPP_DIR"

      - name: Static analysis (cppcheck) [C++] (Windows)
        if: steps.cppcheck_windows.outputs.has_cpp == 'true' && runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $cppCandidates = @(
            "C:\Program Files\Cppcheck\cppcheck.exe",
            "C:\Program Files (x86)\Cppcheck\cppcheck.exe"
          )

          $cppExe = $cppCandidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $cppExe) {
            $cppExe = (Get-Command cppcheck -ErrorAction Stop).Source
          }

          & $cppExe --enable=all --inconclusive --inline-suppr --error-exitcode=1 --suppress=missingIncludeSystem $env:CPP_DIR

      - name: Compile all C++ units (Unix)
        if: steps.cppcheck_unix.outputs.has_cpp == 'true' && runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build_cpp/obj
          while IFS= read -r f; do
            out="build_cpp/obj/$(echo "$f" | sed 's|^\./||; s|[/:\\]|_|g').o"
            clang++ -std=c++17 -Wall -Wextra -Werror -O2 -c "$f" -o "$out"
          done < <(find "$CPP_DIR" -type f \( -name "*.cpp" -o -name "*.cc" -o -name "*.cxx" \))

      - name: Compile all C++ units (Windows)
        if: steps.cppcheck_windows.outputs.has_cpp == 'true' && runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force -Path build_cpp/obj | Out-Null
          $files = Get-ChildItem $env:CPP_DIR -Recurse -File -Include *.cpp,*.cc,*.cxx -ErrorAction SilentlyContinue
          foreach ($f in $files) {
            $safe = ($f.FullName -replace '^[A-Za-z]:\\', '' -replace '[\\/]', '_')
            & clang++ -std=c++17 -Wall -Wextra -Werror -O2 -c $f.FullName -o "build_cpp/obj/$safe.obj"
          }

      - name: C++ skipped
        if: steps.cppcheck_unix.outputs.has_cpp != 'true' && steps.cppcheck_windows.outputs.has_cpp != 'true'
        run: echo "No C++ files -> skipping"

  quality-python:
    name: "Python Quality on ${{ matrix.label }}"
    needs: [detect-target]
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.detect-target.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12

    steps:
      - uses: actions/checkout@v4

      - name: Detect Python files (Unix)
        if: runner.os != 'Windows'
        id: pycheck_unix
        shell: bash
        run: |
          set -euo pipefail
          if [ -d "$PY_DIR" ] && find "$PY_DIR" -type f -name "*.py" | grep -q .; then
            echo "has_py=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_py=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Detect Python files (Windows)
        if: runner.os == 'Windows'
        id: pycheck_windows
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          if (Test-Path $env:PY_DIR) {
            $files = Get-ChildItem $env:PY_DIR -Recurse -File -Include *.py -ErrorAction SilentlyContinue
          } else {
            $files = @()
          }
          if ($files.Count -gt 0) {
            "has_py=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          } else {
            "has_py=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          }

      - uses: actions/setup-python@v5
        if: steps.pycheck_unix.outputs.has_py == 'true' || steps.pycheck_windows.outputs.has_py == 'true'
        with:
          python-version: "3.11"

      - name: Install Python tools (Unix)
        if: steps.pycheck_unix.outputs.has_py == 'true' && runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install ruff mypy pytest

      - name: Install Python tools (Windows)
        if: steps.pycheck_windows.outputs.has_py == 'true' && runner.os == 'Windows'
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install ruff mypy pytest

      - name: Ruff format check (Unix)
        if: steps.pycheck_unix.outputs.has_py == 'true' && runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          python -m ruff format --check "$PY_DIR"

      - name: Ruff format check (Windows)
        if: steps.pycheck_windows.outputs.has_py == 'true' && runner.os == 'Windows'
        shell: pwsh
        run: |
          python -m ruff format --check $env:PY_DIR

      - name: Ruff lint (Unix)
        if: steps.pycheck_unix.outputs.has_py == 'true' && runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          python -m ruff check "$PY_DIR"

      - name: Ruff lint (Windows)
        if: steps.pycheck_windows.outputs.has_py == 'true' && runner.os == 'Windows'
        shell: pwsh
        run: |
          python -m ruff check $env:PY_DIR

      - name: Mypy (best effort) (Unix)
        if: steps.pycheck_unix.outputs.has_py == 'true' && runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          python -m mypy "$PY_DIR" || true

      - name: Mypy (best effort) (Windows)
        if: steps.pycheck_windows.outputs.has_py == 'true' && runner.os == 'Windows'
        shell: pwsh
        run: |
          python -m mypy $env:PY_DIR
          if ($LASTEXITCODE -ne 0) { exit 0 }

      - name: Compileall (Unix)
        if: steps.pycheck_unix.outputs.has_py == 'true' && runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q "$PY_DIR"

      - name: Compileall (Windows)
        if: steps.pycheck_windows.outputs.has_py == 'true' && runner.os == 'Windows'
        shell: pwsh
        run: |
          python -m compileall -q $env:PY_DIR

      - name: Pytest if present (Unix)
        if: steps.pycheck_unix.outputs.has_py == 'true' && runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          if [ -d "tests" ] || find "$PY_DIR" -maxdepth 3 -type f -name "test_*.py" | grep -q .; then
            python -m pytest -q
          else
            echo "No tests -> skipping"
          fi

      - name: Pytest if present (Windows)
        if: steps.pycheck_windows.outputs.has_py == 'true' && runner.os == 'Windows'
        shell: pwsh
        run: |
          if (Test-Path "tests") {
            python -m pytest -q
          } else {
            $tests = Get-ChildItem $env:PY_DIR -Recurse -File -Include test_*.py -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($tests) { python -m pytest -q } else { Write-Host "No tests -> skipping" }
          }

      - name: Python skipped
        if: steps.pycheck_unix.outputs.has_py != 'true' && steps.pycheck_windows.outputs.has_py != 'true'
        run: echo "No Python files -> skipping"

  quality-java:
    name: "Java Quality on ${{ matrix.label }}"
    needs: [detect-target]
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.detect-target.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Detect Java files (Unix)
        if: runner.os != 'Windows'
        id: javacheck_unix
        shell: bash
        run: |
          set -euo pipefail
          if [ -d "$JAVA_DIR" ] && find "$JAVA_DIR" -type f -name "*.java" | grep -q .; then
            echo "has_java=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_java=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Detect Java files (Windows)
        if: runner.os == 'Windows'
        id: javacheck_windows
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          if (Test-Path $env:JAVA_DIR) {
            $files = Get-ChildItem $env:JAVA_DIR -Recurse -File -Include *.java -ErrorAction SilentlyContinue
          } else {
            $files = @()
          }
          if ($files.Count -gt 0) {
            "has_java=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          } else {
            "has_java=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          }

      - uses: actions/setup-java@v4
        if: steps.javacheck_unix.outputs.has_java == 'true' || steps.javacheck_windows.outputs.has_java == 'true'
        with:
          distribution: temurin
          java-version: "17"

      - name: Compile all Java (Unix)
        if: steps.javacheck_unix.outputs.has_java == 'true' && runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          mapfile -t JAVA_FILES < <(find "$JAVA_DIR" -type f -name "*.java")
          if [ "${#JAVA_FILES[@]}" -eq 0 ]; then
            echo "No Java files -> skipping"
            exit 0
          fi
          javac -d out "${JAVA_FILES[@]}"

      - name: Compile all Java (Windows)
        if: steps.javacheck_windows.outputs.has_java == 'true' && runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force -Path out | Out-Null
          if (Test-Path $env:JAVA_DIR) {
            $files = Get-ChildItem $env:JAVA_DIR -Recurse -File -Include *.java -ErrorAction SilentlyContinue
          } else {
            $files = @()
          }
          $paths = $files | ForEach-Object { $_.FullName }
          if ($paths.Count -eq 0) {
            Write-Host "No Java files -> skipping"
            exit 0
          }
          & javac -d out $paths

      - name: Java skipped
        if: steps.javacheck_unix.outputs.has_java != 'true' && steps.javacheck_windows.outputs.has_java != 'true'
        run: echo "No Java files -> skipping"
