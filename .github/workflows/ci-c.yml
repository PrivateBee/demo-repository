name: "CI Quality (C/C++/Python/Java) - run ONLY selected OS"

on:
  pull_request:
  push:
  workflow_dispatch:
    inputs:
      target_os:
        description: "OS cible à exécuter"
        required: false
        default: "linux"
        type: choice
        options:
          - linux
          - windows
          - macos

permissions:
  contents: read

jobs:
  detect-target:
    name: Detect target OS
    runs-on: ubuntu-24.04
    outputs:
      target: ${{ steps.pick.outputs.target }}
      matrix: ${{ steps.pick.outputs.matrix }}
    env:
      INPUT_TARGET: ${{ github.event.inputs.target_os || '' }}
      REF_NAME: ${{ github.head_ref || github.ref_name }}
      PR_TITLE: ${{ github.event.pull_request.title || '' }}
      PR_BODY: ${{ github.event.pull_request.body || '' }}
      COMMIT_MSG: ${{ github.event.head_commit.message || '' }}
    steps:
      - name: Pick target OS
        id: pick
        shell: bash
        run: |
          set -euo pipefail

          manual="$(printf '%s' "$INPUT_TARGET" | tr '[:upper:]' '[:lower:]')"
          ref="$(printf '%s' "$REF_NAME" | tr '[:upper:]' '[:lower:]')"
          text="$(printf '%s %s %s' "$PR_TITLE" "$PR_BODY" "$COMMIT_MSG" | tr '[:upper:]' '[:lower:]')"

          if [[ "$manual" == "windows" ]]; then
            target="windows"
            matrix='{"include":[{"os":"windows-2022","label":"Windows"}]}'
          elif [[ "$manual" == "macos" ]]; then
            target="macos"
            matrix='{"include":[{"os":"macos-14","label":"macOS"}]}'
          elif [[ "$manual" == "linux" ]]; then
            target="linux"
            matrix='{"include":[{"os":"ubuntu-24.04","label":"Ubuntu"}]}'
          elif [[ "$ref" == windows/* ]] || [[ "$text" == *"[windows]"* ]]; then
            target="windows"
            matrix='{"include":[{"os":"windows-2022","label":"Windows"}]}'
          elif [[ "$ref" == macos/* ]] || [[ "$ref" == mac/* ]] || [[ "$text" == *"[macos]"* ]] || [[ "$text" == *"[mac]"* ]]; then
            target="macos"
            matrix='{"include":[{"os":"macos-14","label":"macOS"}]}'
          else
            target="linux"
            matrix='{"include":[{"os":"ubuntu-24.04","label":"Ubuntu"}]}'
          fi

          echo "target=$target" >> "$GITHUB_OUTPUT"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

      - name: Show target
        run: |
          echo "Target = ${{ steps.pick.outputs.target }}"
          echo "Matrix = ${{ steps.pick.outputs.matrix }}"

  quality-c:
    name: "C Quality on ${{ matrix.label }}"
    needs: [detect-target]
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.detect-target.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12

    steps:
      - uses: actions/checkout@v4

      - name: Detect C files (Unix)
        if: runner.os != 'Windows'
        id: ccheck_unix
        shell: bash
        run: |
          set -euo pipefail
          if find . -type f \( -name "*.c" -o -name "*.h" \) ! -path "./.git/*" | grep -q .; then
            echo "has_c=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_c=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Detect C files (Windows)
        if: runner.os == 'Windows'
        id: ccheck_windows
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $files = Get-ChildItem -Recurse -File -Include *.c,*.h -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -notmatch '\\.git\\' }
          if ($files.Count -gt 0) {
            "has_c=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          } else {
            "has_c=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          }

      - name: Install C tools (Linux)
        if: steps.ccheck_unix.outputs.has_c == 'true' && runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang clang-format cppcheck gcovr flawfinder

      - name: Install C tools (macOS)
        if: steps.ccheck_unix.outputs.has_c == 'true' && runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          brew update
          brew install llvm cppcheck
          echo "$(brew --prefix llvm)/bin" >> "$GITHUB_PATH"

      - name: Install C tools (Windows)
        if: steps.ccheck_windows.outputs.has_c == 'true' && runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          choco upgrade -y llvm cppcheck
          Import-Module "$env:ChocolateyInstall\helpers\chocolateyProfile.psm1" -Force
          refreshenv
          $llvmBin = "C:\Program Files\LLVM\bin"
          if (-not (Test-Path $llvmBin)) { throw "LLVM bin not found: $llvmBin" }
          $llvmBin | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          $cppCandidates = @("C:\Program Files\Cppcheck\cppcheck.exe", "C:\Program Files (x86)\Cppcheck\cppcheck.exe")
          $cppExe = $cppCandidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $cppExe) { $cppExe = (Get-Command cppcheck -ErrorAction Stop).Source }
          $cppDir = Split-Path $cppExe -Parent
          $cppDir | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      - name: clang-format check [C] (Unix)
        if: steps.ccheck_unix.outputs.has_c == 'true' && runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          # nullglob evite les erreurs s'il n'y a pas de fichiers .h
          shopt -s nullglob
          clang-format -style=LLVM -i *.c *.h
          # On verifie les modifications (seulement sur C)
          git diff --exit-code

      - name: clang-format check [C] (Windows)
        if: steps.ccheck_windows.outputs.has_c == 'true' && runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Get-ChildItem -File -Include *.c,*.h -ErrorAction SilentlyContinue | ForEach-Object { & clang-format -style=LLVM -i $_.FullName }
          git diff --exit-code

      - name: Static analysis (cppcheck) [C] (Unix)
        if: steps.ccheck_unix.outputs.has_c == 'true' && runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          cppcheck --enable=all --inconclusive --inline-suppr --suppress=missingIncludeSystem --xml *.c *.h 2> cppcheck-report.xml

      - name: Security Scan SAST (Flawfinder) [C] (Unix)
        if: steps.ccheck_unix.outputs.has_c == 'true' && runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          flawfinder --singleline *.c *.h > flawfinder-report.txt || true

      - name: Test & Coverage [C] (Unix)
        if: steps.ccheck_unix.outputs.has_c == 'true' && runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          if [ -f "Makefile" ] || [ -f "CMakeLists.txt" ]; then
            gcovr --xml-pretty --exclude-unreachable-branches --print-summary -o coverage.xml -r . || true
          else
            touch coverage.xml
          fi

      - name: Compile all C units (Unix)
        if: steps.ccheck_unix.outputs.has_c == 'true' && runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build_c/obj
          shopt -s nullglob
          for f in *.c; do
            out="build_c/obj/${f%.c}.o"
            clang -std=c11 -Wall -Wextra -Werror -O2 -c "$f" -o "$out"
          done

      - name: Compile all C units (Windows)
        if: steps.ccheck_windows.outputs.has_c == 'true' && runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force -Path build_c/obj | Out-Null
          $files = Get-ChildItem -File -Include *.c
          foreach ($f in $files) {
            $safe = ($f.Name -replace '\.c$', '.obj')
            & clang -std=c11 -Wall -Wextra -Werror -O2 -c $f.FullName -o "build_c/obj/$safe"
          }

  quality-cpp:
    name: "C++ Quality on ${{ matrix.label }}"
    needs: [detect-target]
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.detect-target.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12

    steps:
      - uses: actions/checkout@v4

      - name: Detect C++ files (Unix)
        if: runner.os != 'Windows'
        id: cppcheck_unix
        shell: bash
        run: |
          set -euo pipefail
          if find . -type f \( -name "*.cpp" -o -name "*.cc" -o -name "*.cxx" -o -name "*.hpp" -o -name "*.hxx" -o -name "*.h" \) ! -path "./.git/*" | grep -q .; then
            echo "has_cpp=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_cpp=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Detect C++ files (Windows)
        if: runner.os == 'Windows'
        id: cppcheck_windows
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $files = Get-ChildItem -Recurse -File -Include *.cpp,*.cc,*.cxx,*.hpp,*.hxx,*.h -ErrorAction SilentlyContinue | Where-Object { $_.FullName -notmatch '\\.git\\' }
          if ($files.Count -gt 0) { "has_cpp=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8 } else { "has_cpp=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8 }

      - name: Install C++ tools (Linux)
        if: steps.cppcheck_unix.outputs.has_cpp == 'true' && runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang clang-format cppcheck gcovr flawfinder

      - name: Install C++ tools (macOS)
        if: steps.cppcheck_unix.outputs.has_cpp == 'true' && runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          brew update
          brew install llvm cppcheck
          echo "$(brew --prefix llvm)/bin" >> "$GITHUB_PATH"

      - name: Install C++ tools (Windows)
        if: steps.cppcheck_windows.outputs.has_cpp == 'true' && runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          choco upgrade -y llvm cppcheck
          Import-Module "$env:ChocolateyInstall\helpers\chocolateyProfile.psm1" -Force
          refreshenv
          $llvmBin = "C:\Program Files\LLVM\bin"
          if (-not (Test-Path $llvmBin)) { throw "LLVM bin not found: $llvmBin" }
          $llvmBin | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          $cppCandidates = @("C:\Program Files\Cppcheck\cppcheck.exe", "C:\Program Files (x86)\Cppcheck\cppcheck.exe")
          $cppExe = $cppCandidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $cppExe) { $cppExe = (Get-Command cppcheck -ErrorAction Stop).Source }
          $cppDir = Split-Path $cppExe -Parent
          $cppDir | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      - name: clang-format check [C++] (Unix)
        if: steps.cppcheck_unix.outputs.has_cpp == 'true' && runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          clang-format -style=LLVM -i *.cpp *.cc *.cxx *.hpp *.hxx *.h
          git diff --exit-code

      - name: Static analysis (cppcheck) [C++] (Unix)
        if: steps.cppcheck_unix.outputs.has_cpp == 'true' && runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          cppcheck --enable=all --inconclusive --inline-suppr --suppress=missingIncludeSystem --xml *.cpp *.cc *.cxx *.hpp *.hxx *.h 2> cppcheck-report.xml

      - name: Security Scan SAST (Flawfinder) [C++] (Unix)
        if: steps.cppcheck_unix.outputs.has_cpp == 'true' && runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          flawfinder --singleline *.cpp *.cc *.cxx *.hpp *.hxx *.h > flawfinder-report.txt || true

      - name: Test & Coverage [C++] (Unix)
        if: steps.cppcheck_unix.outputs.has_cpp == 'true' && runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          if [ -f "Makefile" ] || [ -f "CMakeLists.txt" ]; then
            gcovr --xml-pretty --exclude-unreachable-branches --print-summary -o coverage.xml -r . || true
          else
            touch coverage.xml
          fi

  quality-python:
    name: "Python Quality on ${{ matrix.label }}"
    needs: [detect-target]
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.detect-target.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12

    steps:
      - uses: actions/checkout@v4

      - name: Detect Python files (Unix)
        if: runner.os != 'Windows'
        id: pycheck_unix
        shell: bash
        run: |
          set -euo pipefail
          if find . -type f -name "*.py" ! -path "./.git/*" | grep -q .; then echo "has_py=true" >> "$GITHUB_OUTPUT"; else echo "has_py=false" >> "$GITHUB_OUTPUT"; fi

      - name: Detect Python files (Windows)
        if: runner.os == 'Windows'
        id: pycheck_windows
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $files = Get-ChildItem -Recurse -File -Include *.py -ErrorAction SilentlyContinue | Where-Object { $_.FullName -notmatch '\\.git\\' }
          if ($files.Count -gt 0) { "has_py=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8 } else { "has_py=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8 }

      - uses: actions/setup-python@v5
        if: steps.pycheck_unix.outputs.has_py == 'true' || steps.pycheck_windows.outputs.has_py == 'true'
        with:
          python-version: "3.11"

      - name: Install Python tools (Unix)
        if: steps.pycheck_unix.outputs.has_py == 'true' && runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install ruff mypy pytest coverage bandit

      - name: Install Python tools (Windows)
        if: steps.pycheck_windows.outputs.has_py == 'true' && runner.os == 'Windows'
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install ruff mypy pytest coverage bandit

      - name: Ruff format & lint (Unix)
        if: steps.pycheck_unix.outputs.has_py == 'true' && runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          python -m ruff format --check *.py
          python -m ruff check *.py

      - name: Ruff format & lint (Windows)
        if: steps.pycheck_windows.outputs.has_py == 'true' && runner.os == 'Windows'
        shell: pwsh
        run: |
          python -m ruff format --check *.py
          python -m ruff check *.py

      - name: Mypy (best effort) (Unix)
        if: steps.pycheck_unix.outputs.has_py == 'true' && runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          python -m mypy *.py || true

      - name: Mypy (best effort) (Windows)
        if: steps.pycheck_windows.outputs.has_py == 'true' && runner.os == 'Windows'
        shell: pwsh
        run: |
          python -m mypy *.py
          if ($LASTEXITCODE -ne 0) { exit 0 }

      - name: Security Scan (Bandit)
        if: steps.pycheck_unix.outputs.has_py == 'true' || steps.pycheck_windows.outputs.has_py == 'true'
        shell: bash
        run: |
          shopt -s nullglob
          python -m bandit -f xml -o bandit-report.xml *.py || true

      - name: Pytest & Coverage (Unix)
        if: steps.pycheck_unix.outputs.has_py == 'true' && runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          if [ -d "tests" ] || find . -maxdepth 3 -type f -name "test_*.py" | grep -q .; then
            echo "✅ Lancement de pytest et calcul du coverage (Non bloquant si aucun test trouvé)..."
            # L'ajout de || true empêche la CI de crasher si pytest retourne l'erreur 5 (No tests collected)
            python -m coverage run -m pytest -q --junitxml=pytest-report.xml || true
            python -m coverage xml || true
          else
            echo "⚠️ Aucun test détecté -> skipping"
            touch coverage.xml pytest-report.xml
          fi

      - name: Pytest & Coverage (Windows)
        if: steps.pycheck_windows.outputs.has_py == 'true' && runner.os == 'Windows'
        shell: pwsh
        run: |
          $hasTests = $false
          if (Test-Path "tests") { $hasTests = $true } else { $tests = Get-ChildItem -Recurse -File -Include test_*.py -ErrorAction SilentlyContinue | Select-Object -First 1; if ($tests) { $hasTests = $true } }
          if ($hasTests) {
            Write-Host "✅ Lancement de pytest et calcul du coverage (Non bloquant si aucun test trouvé)..."
            & python -m coverage run -m pytest -q --junitxml=pytest-report.xml
            if ($LASTEXITCODE -ne 0) { Write-Host "⚠️ Pytest a échoué ou n'a trouvé aucun test (Exit code $LASTEXITCODE). Mode non-bloquant : on continue." }
            & python -m coverage xml
          } else {
            Write-Host "⚠️ Aucun test détecté -> skipping"
            New-Item -ItemType File -Force -Path coverage.xml | Out-Null
            New-Item -ItemType File -Force -Path pytest-report.xml | Out-Null
          }

  quality-java:
    name: "Java Quality on ${{ matrix.label }}"
    needs: [detect-target]
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.detect-target.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Detect Java files (Unix)
        if: runner.os != 'Windows'
        id: javacheck_unix
        shell: bash
        run: |
          set -euo pipefail
          if find . -type f -name "*.java" ! -path "./.git/*" | grep -q .; then echo "has_java=true" >> "$GITHUB_OUTPUT"; else echo "has_java=false" >> "$GITHUB_OUTPUT"; fi

      - name: Detect Java files (Windows)
        if: runner.os == 'Windows'
        id: javacheck_windows
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $files = Get-ChildItem -Recurse -File -Include *.java -ErrorAction SilentlyContinue | Where-Object { $_.FullName -notmatch '\\.git\\' }
          if ($files.Count -gt 0) { "has_java=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8 } else { "has_java=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8 }

      - uses: actions/setup-java@v4
        if: steps.javacheck_unix.outputs.has_java == 'true' || steps.javacheck_windows.outputs.has_java == 'true'
        with:
          distribution: temurin
          java-version: "17"

      - name: Build, Test & Coverage (Maven/Gradle) (Unix)
        if: steps.javacheck_unix.outputs.has_java == 'true' && runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          if [ -f "pom.xml" ]; then
            echo "Projet Maven détecté. Lancement de l'analyse..."
            mvn clean test jacoco:report -fn
          elif [ -f "build.gradle" ]; then
            echo " Projet Gradle détecté. Lancement de l'analyse..."
            ./gradlew test jacocoTestReport --continue || true
          else
            echo "Aucun pom.xml ou build.gradle trouvé. Compilation de secours..."
            mkdir -p out
            mapfile -t JAVA_FILES < <(find . -type f -name "*.java" ! -path "./.git/*")
            if [ "${#JAVA_FILES[@]}" -gt 0 ]; then javac -d out "${JAVA_FILES[@]}"; fi
            mkdir -p target/site/jacoco
            touch target/site/jacoco/jacoco.xml
          fi

      - name: Build, Test & Coverage (Maven/Gradle) (Windows)
        if: steps.javacheck_windows.outputs.has_java == 'true' && runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          if (Test-Path "pom.xml") {
            mvn clean test jacoco:report -fn
          } elseif (Test-Path "build.gradle") {
            .\gradlew test jacocoTestReport --continue; if ($LASTEXITCODE -ne 0) { exit 0 }
          } else {
            New-Item -ItemType Directory -Force -Path out | Out-Null
            $files = Get-ChildItem -Recurse -File -Include *.java | Where-Object { $_.FullName -notmatch '\\.git\\' }
            if ($files.Count -gt 0) { & javac -d out ($files.FullName) }
            New-Item -ItemType Directory -Force -Path "target\site\jacoco" | Out-Null
            New-Item -ItemType File -Force -Path "target\site\jacoco\jacoco.xml" | Out-Null
          }
