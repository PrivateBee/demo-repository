name: "CI Quality (C/C++/Python/Java) - run ONLY selected OS"

on:
  pull_request:
  push:
  workflow_dispatch:
    inputs:
      target_os:
        description: "OS cible à exécuter"
        required: false
        default: "linux"
        type: choice
        options:
          - linux
          - windows
          - macos

permissions:
  contents: read

jobs:
  detect-target:
    name: "Detect target OS"
    runs-on: ubuntu-24.04
    outputs:
      target: ${{ steps.pick.outputs.target }}
    env:
      INPUT_TARGET: ${{ github.event.inputs.target_os || '' }}
      REF_NAME: ${{ github.head_ref || github.ref_name }}
      PR_TITLE: ${{ github.event.pull_request.title || '' }}
      PR_BODY: ${{ github.event.pull_request.body || '' }}
      COMMIT_MSG: ${{ github.event.head_commit.message || '' }}
    steps:
      - name: Pick target OS
        id: pick
        shell: bash
        run: |
          set -euo pipefail

          manual="$(printf '%s' "$INPUT_TARGET" | tr '[:upper:]' '[:lower:]')"
          ref="$(printf '%s' "$REF_NAME" | tr '[:upper:]' '[:lower:]')"
          text="$(printf '%s %s %s' "$PR_TITLE" "$PR_BODY" "$COMMIT_MSG" | tr '[:upper:]' '[:lower:]')"

          if [[ "$manual" == "windows" || "$manual" == "linux" || "$manual" == "macos" ]]; then
            target="$manual"
          elif [[ "$ref" == windows/* ]] || [[ "$text" == *"[windows]"* ]]; then
            target="windows"
          elif [[ "$ref" == linux/* ]] || [[ "$ref" == ubuntu/* ]] || [[ "$text" == *"[linux]"* ]] || [[ "$text" == *"[ubuntu]"* ]]; then
            target="linux"
          elif [[ "$ref" == macos/* ]] || [[ "$ref" == mac/* ]] || [[ "$text" == *"[macos]"* ]] || [[ "$text" == *"[mac]"* ]]; then
            target="macos"
          else
            target="linux"
          fi

          echo "target=$target" >> "$GITHUB_OUTPUT"
          echo "Selected target = $target"

  # ==========================================================
  # C
  # ==========================================================
  quality-c:
    name: "C Quality on ${{ matrix.label }}"
    needs: [detect-target]
    if: needs.detect-target.outputs.target == matrix.target
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: linux
            label: Ubuntu
          - os: macos-14
            target: macos
            label: macOS
          - os: windows-2022
            target: windows
            label: Windows
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12

    steps:
      - uses: actions/checkout@v4

      - name: Detect C files
        id: ccheck
        shell: bash
        run: |
          set -euo pipefail
          if find . -type f \( -name "*.c" -o -name "*.h" \) ! -path "./.git/*" | grep -q .; then
            echo "has_c=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_c=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install C tools (Linux)
        if: steps.ccheck.outputs.has_c == 'true' && runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang clang-format cppcheck

      - name: Install C tools (macOS)
        if: steps.ccheck.outputs.has_c == 'true' && runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          brew update
          brew install llvm cppcheck
          echo "$(brew --prefix llvm)/bin" >> "$GITHUB_PATH"

      - name: Install C tools (Windows)
        if: steps.ccheck.outputs.has_c == 'true' && runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          choco install -y llvm cppcheck.portable

          Import-Module "$env:ChocolateyInstall\helpers\chocolateyProfile.psm1" -Force
          refreshenv

          $llvmBin = "C:\Program Files\LLVM\bin"
          if (-not (Test-Path $llvmBin)) {
            throw "LLVM bin not found: $llvmBin"
          }

          $llvmBin | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

          $cpp = Get-Command cppcheck -ErrorAction Stop
          $cppDir = Split-Path $cpp.Source -Parent
          $cppDir | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

          clang-format --version
          cppcheck --version

      - name: clang-format check [C]
        if: steps.ccheck.outputs.has_c == 'true'
        shell: bash
        run: |
          set -euo pipefail
          find . -type f \( -name "*.c" -o -name "*.h" \) ! -path "./.git/*" -print0 \
            | xargs -0 -I{} clang-format -style=LLVM -i "{}"
          git diff --exit-code

      - name: Static analysis (cppcheck) [C]
        if: steps.ccheck.outputs.has_c == 'true'
        shell: bash
        run: |
          set -euo pipefail
          find . -type f \( -name "*.c" -o -name "*.h" \) ! -path "./.git/*" -print0 \
            | xargs -0 cppcheck --enable=all --inconclusive \
                --inline-suppr --error-exitcode=1 \
                --suppress=missingIncludeSystem

      - name: Compile all C units (no linking)
        if: steps.ccheck.outputs.has_c == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build_c/obj
          while IFS= read -r f; do
            out="build_c/obj/$(echo "$f" | sed 's|^\./||; s|[/:\\]|_|g').o"
            clang -std=c11 -Wall -Wextra -Werror -O2 -c "$f" -o "$out"
          done < <(find . -type f -name "*.c" ! -path "./.git/*")

      - name: C skipped
        if: steps.ccheck.outputs.has_c != 'true'
        shell: bash
        run: echo "No C files -> skipping"

  # ==========================================================
  # C++
  # ==========================================================
  quality-cpp:
    name: "C++ Quality on ${{ matrix.label }}"
    needs: [detect-target]
    if: needs.detect-target.outputs.target == matrix.target
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: linux
            label: Ubuntu
          - os: macos-14
            target: macos
            label: macOS
          - os: windows-2022
            target: windows
            label: Windows
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12

    steps:
      - uses: actions/checkout@v4

      - name: Detect C++ files
        id: cppcheck
        shell: bash
        run: |
          set -euo pipefail
          if find . -type f \( -name "*.cpp" -o -name "*.cc" -o -name "*.cxx" -o -name "*.hpp" -o -name "*.hxx" -o -name "*.h" \) ! -path "./.git/*" | grep -q .; then
            echo "has_cpp=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_cpp=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install C++ tools (Linux)
        if: steps.cppcheck.outputs.has_cpp == 'true' && runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang clang-format cppcheck

      - name: Install C++ tools (macOS)
        if: steps.cppcheck.outputs.has_cpp == 'true' && runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          brew update
          brew install llvm cppcheck
          echo "$(brew --prefix llvm)/bin" >> "$GITHUB_PATH"

      - name: Install C++ tools (Windows)
        if: steps.cppcheck.outputs.has_cpp == 'true' && runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          choco install -y llvm cppcheck.portable

          Import-Module "$env:ChocolateyInstall\helpers\chocolateyProfile.psm1" -Force
          refreshenv

          $llvmBin = "C:\Program Files\LLVM\bin"
          if (-not (Test-Path $llvmBin)) {
            throw "LLVM bin not found: $llvmBin"
          }

          $llvmBin | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

          $cpp = Get-Command cppcheck -ErrorAction Stop
          $cppDir = Split-Path $cpp.Source -Parent
          $cppDir | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

          clang-format --version
          cppcheck --version

      - name: clang-format check [C++]
        if: steps.cppcheck.outputs.has_cpp == 'true'
        shell: bash
        run: |
          set -euo pipefail
          find . -type f \( -name "*.cpp" -o -name "*.cc" -o -name "*.cxx" -o -name "*.hpp" -o -name "*.hxx" -o -name "*.h" \) ! -path "./.git/*" -print0 \
            | xargs -0 -I{} clang-format -style=LLVM -i "{}"
          git diff --exit-code

      - name: Static analysis (cppcheck) [C++]
        if: steps.cppcheck.outputs.has_cpp == 'true'
        shell: bash
        run: |
          set -euo pipefail
          find . -type f \( -name "*.cpp" -o -name "*.cc" -o -name "*.cxx" -o -name "*.hpp" -o -name "*.hxx" -o -name "*.h" \) ! -path "./.git/*" -print0 \
            | xargs -0 cppcheck --enable=all --inconclusive \
                --inline-suppr --error-exitcode=1 \
                --suppress=missingIncludeSystem

      - name: Compile all C++ units (no linking)
        if: steps.cppcheck.outputs.has_cpp == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build_cpp/obj
          while IFS= read -r f; do
            out="build_cpp/obj/$(echo "$f" | sed 's|^\./||; s|[/:\\]|_|g').o"
            clang++ -std=c++17 -Wall -Wextra -Werror -O2 -c "$f" -o "$out"
          done < <(find . -type f \( -name "*.cpp" -o -name "*.cc" -o -name "*.cxx" \) ! -path "./.git/*")

      - name: C++ skipped
        if: steps.cppcheck.outputs.has_cpp != 'true'
        shell: bash
        run: echo "No C++ files -> skipping"

  # ==========================================================
  # PYTHON
  # ==========================================================
  quality-python:
    name: "Python Quality on ${{ matrix.label }}"
    needs: [detect-target]
    if: needs.detect-target.outputs.target == matrix.target
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: linux
            label: Ubuntu
          - os: macos-14
            target: macos
            label: macOS
          - os: windows-2022
            target: windows
            label: Windows
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12

    steps:
      - uses: actions/checkout@v4

      - name: Detect Python files
        id: pycheck
        shell: bash
        run: |
          set -euo pipefail
          if find . -type f -name "*.py" ! -path "./.git/*" | grep -q .; then
            echo "has_py=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_py=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v5
        if: steps.pycheck.outputs.has_py == 'true'
        with:
          python-version: "3.11"

      - name: Install Python tools
        if: steps.pycheck.outputs.has_py == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install ruff mypy pytest

      - name: Ruff format check
        if: steps.pycheck.outputs.has_py == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python -m ruff format --check .

      - name: Ruff lint
        if: steps.pycheck.outputs.has_py == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python -m ruff check .

      - name: Mypy (best effort)
        if: steps.pycheck.outputs.has_py == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python -m mypy . || true

      - name: Compileall
        if: steps.pycheck.outputs.has_py == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q .

      - name: Pytest if present
        if: steps.pycheck.outputs.has_py == 'true'
        shell: bash
        run: |
          set -euo pipefail
          if [ -d "tests" ] || find . -maxdepth 3 -type f -name "test_*.py" | grep -q .; then
            python -m pytest -q
          else
            echo "No tests -> skipping"
          fi

      - name: Python skipped
        if: steps.pycheck.outputs.has_py != 'true'
        shell: bash
        run: echo "No Python files -> skipping"

  # ==========================================================
  # JAVA
  # ==========================================================
  quality-java:
    name: "Java Quality on ${{ matrix.label }}"
    needs: [detect-target]
    if: needs.detect-target.outputs.target == matrix.target
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: linux
            label: Ubuntu
          - os: macos-14
            target: macos
            label: macOS
          - os: windows-2022
            target: windows
            label: Windows
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Detect Java files
        id: javacheck
        shell: bash
        run: |
          set -euo pipefail
          if find . -type f -name "*.java" ! -path "./.git/*" | grep -q .; then
            echo "has_java=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_java=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-java@v4
        if: steps.javacheck.outputs.has_java == 'true'
        with:
          distribution: temurin
          java-version: "17"

      - name: Compile all Java
        if: steps.javacheck.outputs.has_java == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          mapfile -t JAVA_FILES < <(find . -type f -name "*.java" ! -path "./.git/*")
          if [ "${#JAVA_FILES[@]}" -eq 0 ]; then
            echo "No Java files -> skipping"
            exit 0
          fi
          javac -d out "${JAVA_FILES[@]}"

      - name: Java skipped
        if: steps.javacheck.outputs.has_java != 'true'
        shell: bash
        run: echo "No Java files -> skipping"